<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Treaps · Clave y prioridad</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090e19;color:#edf3ff;font:16px/1.5 system-ui,sans-serif}body{padding:16px}.deck{max-width:1440px;min-height:calc(100dvh - 32px);margin:auto;display:grid;grid-template-rows:auto 1fr auto;gap:12px}header,footer,aside,.stage{border:1px solid #293650;background:#10192b;border-radius:18px}header{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:clamp(18px,2vw,25px);margin:4px 0}.eyebrow{color:#fbbf24;font-size:12px;font-weight:800;letter-spacing:.08em}#counter{color:#b0c1db;white-space:nowrap}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;min-width:0}.stage{overflow:auto;min-width:0;background-color:#0b1323;background-image:radial-gradient(#26344c 1px,transparent 1px);background-size:28px 28px;display:grid;align-items:center}svg{display:block;width:100%;min-width:700px;min-height:400px;max-height:660px;aspect-ratio:840/500}aside{padding:22px;align-self:stretch}h2{font-size:13px;text-transform:uppercase;color:#a8bad5;letter-spacing:.06em;margin:0 0 15px}#badge{padding:12px;border:1px solid #39718a;border-radius:12px;color:#67e8f9;overflow-wrap:anywhere}#badge[data-tone=danger]{border-color:#f87171;color:#fca5a5}#badge[data-tone=success]{border-color:#34d399;color:#6ee7b7}.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;font-size:13px}.legend span{padding:5px 9px;border:1px solid #334155;border-radius:8px}.key{fill:#67e8f9;color:#67e8f9}.priority{fill:#fbbf24;color:#fbbf24}.note{color:#a8bad5;font-size:13px;margin-top:24px}footer{padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}button{font:inherit;font-size:14px;border:1px solid #475569;border-radius:10px;padding:10px 14px;background:#202e47;color:#f1f5ff;cursor:pointer;min-height:42px}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid #67e8f9;outline-offset:3px}#next{background:#fbbf24;color:#172033;border-color:#fbbf24;font-weight:700}#steps{display:flex;gap:5px;flex-wrap:wrap}#steps button{padding:6px 11px}#steps button[aria-current]{background:#155e75;border-color:#67e8f9}.actions{display:flex;gap:8px}.node rect{fill:#16243a;stroke:#6b7e9c;stroke-width:2}.node[data-tone=focus] rect{stroke:#fbbf24;stroke-width:3}.node[data-tone=danger] rect{stroke:#f87171;stroke-width:3}.node[data-tone=success] rect{stroke:#34d399;stroke-width:3}.divider{stroke:#50617d;stroke-width:1.5}.node text{text-anchor:middle;font-family:ui-monospace,monospace}.caption{font-size:10px;font-weight:700}.value{font-size:23px;font-weight:800}#edges path{fill:none;stroke:#879bb9;stroke-width:3}#edges path.conflict{stroke:#f87171;stroke-dasharray:7 5}
@media(max-width:900px){body{padding:10px}.deck{min-height:calc(100dvh - 20px)}.workspace{grid-template-columns:minmax(0,1fr)}aside{padding:16px}#explanation{margin:10px 0}.legend{margin-top:12px}.note{margin-top:12px}.stage{max-height:440px}header{padding:12px}footer{gap:8px}#steps{order:3;justify-content:center;width:100%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:901px){.deck{height:calc(100dvh - 32px);grid-template-rows:auto minmax(400px,1fr) auto}.workspace{min-height:0}.stage svg{height:100%;min-height:0;aspect-ratio:auto}}
aside{min-width:0;min-height:0;overflow:auto}h1,#explanation{overflow-wrap:anywhere}
</style></head><body><main class="deck"><header><div><span class="eyebrow">TREAP = TREE + HEAP</span><h1 id="step-title"></h1></div><span id="counter" role="status" aria-live="polite"></span></header>
<div class="workspace"><section class="stage" tabindex="0" aria-label="Árbol animado; desplazá horizontalmente para explorar"><svg id="scene" viewBox="0 0 840 500" role="img" aria-label="Treap: claves y prioridades"><g id="edges"></g><g id="nodes"></g></svg></section><aside aria-label="Explicación del paso"><h2>Qué está pasando</h2><div id="badge"></div><p id="explanation"></p><div class="legend"><span class="key">Clave: izquierda / derecha</span><span class="priority">Prioridad: padre / hijo</span></div><p class="note">Ejemplo didáctico adicional con valores fijos. Convención: heap de máximo. Usá ← y → para recorrer los pasos.</p></aside></div>
<footer><button id="prev">Anterior</button><div id="steps" role="group" aria-label="Elegir paso"></div><div class="actions"><button id="replay">Repetir</button><button id="next">Siguiente</button></div></footer></main><script>/* PLAYER */</script></body></html>
