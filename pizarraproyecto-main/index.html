<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <style>
      html { background: #fff; color-scheme: light; }
      html[data-board-theme="dark"] { background: #171b24; color-scheme: dark; }
      html[data-board-theme="rest"] { background: #eee5d3; }
    </style>
    <script>
      try {
        var boardTheme = localStorage.getItem('pizarra-theme');
        if (boardTheme === 'dark' || boardTheme === 'rest') document.documentElement.dataset.boardTheme = boardTheme;
      } catch (_) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/pizarra/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171b25" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/pizarra/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pizarra/icons/pizarra-192.png" />
    <title>Tu pizarra</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
