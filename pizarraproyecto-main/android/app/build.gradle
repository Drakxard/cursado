plugins { id 'com.android.application' }
def signingFile = rootProject.file('../.android-build/signing.properties')
def signingProperties = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
android {
    namespace 'com.sofic.pizarra'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sofic.pizarra'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            if(signingFile.exists()) {
                storeFile rootProject.file('../.android-build/pizarra-release.jks')
                storePassword signingProperties['storePassword']
                keyAlias 'pizarra'
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
    implementation 'androidx.browser:browser:1.9.0'
}
