name: Compilación y pruebas de Cursado

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      focus:
        description: Comprobaciones a ejecutar
        type: choice
        default: all
        options:
          - all
          - explanations
          - interaction-ui
          - pizarra-text
          - study-camera

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-package:
    if: ${{ inputs.focus != 'explanations' && inputs.focus != 'interaction-ui' && inputs.focus != 'pizarra-text' && inputs.focus != 'study-camera' }}
    name: Preparar servicio Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compilar Worker para despliegue
        run: npm run cloudflare:check -- --outdir "$RUNNER_TEMP/cursado-worker"
      - uses: actions/upload-artifact@v4
        with:
          name: cursado-worker
          path: ${{ runner.temp }}/cursado-worker/

  checks:
    if: ${{ inputs.focus != 'explanations' && inputs.focus != 'interaction-ui' && inputs.focus != 'pizarra-text' && inputs.focus != 'study-camera' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pizarraproyecto-main/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm ci
        working-directory: pizarraproyecto-main
      - run: npx playwright install --with-deps chromium
      - run: npx playwright install chromium
        working-directory: pizarraproyecto-main
      - run: python -m pip install -r pizarraproyecto-main/requirements.txt
      - name: Compilar motor D3 integrado y visor PDF
        run: npm run build:pdf-explanation-ui
      - run: npm run typecheck
      - run: npm test
      - name: Probar estrella, grafos D3 y exportación sin conexión
        run: npm run test:explanations
      - run: npm run cloudflare:check
      - run: npm test
        working-directory: pizarraproyecto-main
      - run: npm run test:pdf-search
      - run: npm run test:voice
      - run: npm run test:synthesis-paste
      - run: npm run test:services
      - name: Conexión R2 guardada y guía ilustrada
        run: node --test --experimental-strip-types tests/workspace-library-panel.browser.mts
      - run: npm run build
      - name: Interfaz original de Cursado en Android sin conexión
        run: node --test tests/native-web.browser.mjs
      - name: Pruebas del servidor Python con base temporal
        run: python pizarraproyecto-main/tests/hosting_namespace.test.py
      - name: Guardado de accesos a PDF fijados
        run: python pizarraproyecto-main/tests/pdf_shortcuts.test.py
      - name: Navegación, sesiones, guardado y modo sin conexión
        shell: bash
        run: |
          node node_modules/next/dist/bin/next start > "$RUNNER_TEMP/cursado-next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:3000/ > /dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://localhost:3000/ > /dev/null
          npm run test:integration
      - name: Actualizaciones y copias sin conexión de Pizarra
        if: ${{ !cancelled() }}
        run: npm run test:browser -- tests/browser/offline-study.spec.mjs tests/browser/app-update.spec.mjs tests/browser/pdf-shortcuts.spec.mjs
        working-directory: pizarraproyecto-main
      - name: Importantes sin controles de promedio
        if: ${{ !cancelled() }}
        run: node --test tests/important-progress.browser.mjs
      - name: Edición directa de notas adhesivas en escritorio y móvil
        if: ${{ !cancelled() }}
        run: npm run test:browser -- tests/browser/sticky-notes.spec.mjs tests/browser/text-escape.spec.mjs tests/browser/clipboard-mindmap.spec.mjs tests/browser/board-links.spec.mjs tests/browser/collaboration.spec.mjs
        working-directory: pizarraproyecto-main
      - name: Guardar capturas y diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cursado-diagnosticos
          if-no-files-found: ignore
          path: |
            test-results/
            pizarraproyecto-main/test-results/
            ${{ runner.temp }}/cursado-next.log

  board-cooperation:
    if: ${{ inputs.focus != 'explanations' && inputs.focus != 'interaction-ui' && inputs.focus != 'pizarra-text' && inputs.focus != 'study-camera' }}
    name: Pizarra, API chat y cooperación semanal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pizarraproyecto-main/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: pizarraproyecto-main
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Sincronización, exclusiones y ruta de API chat
        run: node --test --experimental-strip-types tests/cooperation*.test.mts tests/board-chat.test.mts
      - name: Avisos y sincronización con el Worker real
        shell: bash
        run: |
          npx --yes wrangler@4.151.0 dev --local --config cloudflare/wrangler.jsonc --port 8794 --var AUTH_PEPPER:integration-test-pepper-with-over-32-characters > "$RUNNER_TEMP/cooperation-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8794/health > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8794/health > /dev/null
          COOP_LOCAL_URL=http://127.0.0.1:8794 node --test tests/cooperation-worker.integration.mjs tests/board-links-worker.integration.mjs
      - name: Invitaciones, selector semanal y overlay de chat
        run: node --test --experimental-strip-types tests/cooperation-panel.browser.mts tests/board-api-chat.browser.mjs
      - run: npm run build
      - name: Compartir pizarras por enlace, cadena y PDF
        run: node --test --experimental-strip-types tests/board-links.browser.mjs
      - name: Pizarra y selección de semanas en la aplicación completa
        shell: bash
        run: |
          node node_modules/next/dist/bin/next start > "$RUNNER_TEMP/cursado-board-cooperation.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:3000/ > /dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://localhost:3000/ > /dev/null
          node --test tests/cooperation-weeks.browser.mjs
          CURSADO_TEST_URL=http://localhost:3000 node --test tests/cooperation-study.browser.mjs
          node --test tests/board-library.browser.mjs
      - name: Guardar capturas y diagnósticos de cooperación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pizarra-cooperacion-diagnosticos
          if-no-files-found: ignore
          path: |
            test-results/
            ${{ runner.temp }}/cursado-board-cooperation.log
            ${{ runner.temp }}/cooperation-worker.log

  pizarra-text:
    name: Texto, KaTeX y árboles editables
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.focus == 'pizarra-text' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pizarraproyecto-main/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: pizarraproyecto-main
      - run: npx playwright install --with-deps chromium
        working-directory: pizarraproyecto-main
      - run: npm run build:pizarra
      - run: npx vitest run tests/mindmap.test.ts
        working-directory: pizarraproyecto-main
      - run: npm run test:browser -- tests/browser/clipboard-mindmap.spec.mjs tests/browser/text-escape.spec.mjs --workers=1
        working-directory: pizarraproyecto-main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pizarra-texto-diagnosticos
          if-no-files-found: ignore
          path: pizarraproyecto-main/test-results/

  explanation-regression:
    name: Regresión puntual de estrella y zoom
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.focus == 'explanations' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:pdf-explanation-ui
      - run: node --test --experimental-strip-types --test-name-pattern="PDF.js star generates|light graph player" tests/pdf-explanation.browser.mjs tests/pdf-explanation-graphs.browser.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estrella-grafos-diagnosticos
          if-no-files-found: ignore
          path: test-results/


  interaction-ui:
    name: Interfaz de Importantes y cooperacion
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.focus == 'interaction-ui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test --experimental-strip-types tests/important-progress.browser.mjs tests/cooperation-panel.browser.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interaction-ui-diagnosticos
          if-no-files-found: ignore
          path: test-results/

  study-camera:
    name: Camara directa de estudio
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.focus == 'all' || inputs.focus == 'study-camera' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pizarra-sync
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pizarra-sync/pnpm-lock.yaml
      - name: Instalar dependencias de la aplicacion integrada
        run: npm ci
        working-directory: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @komuboard/client-web typecheck
      - name: Comprobar tipos del visor y la aplicacion
        run: npm run typecheck
        working-directory: .
      - name: Compilar la pizarra de estudio integrada
        run: node scripts/build-study-board.mjs
        working-directory: .
        env:
          STUDY_BOARD_WORKER_HOST: 127.0.0.1:8787
      - run: pnpm exec playwright install --with-deps chromium
      - name: Camara, geometria y gestos
        run: pnpm exec playwright test e2e/camera-direct.spec.ts e2e/viewport.spec.ts --trace on
      - name: Preparar Chromium de las pruebas de integracion
        run: npx playwright install chromium
        working-directory: .
      - name: Insertar y editar diagramas con la pizarra compilada tras una actualizacion
        run: node scripts/test-study-board.mjs --test-name-pattern="diagram chooser|image reader opens"
        working-directory: .
        env:
          STUDY_TEST_BUILT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-camera-diagnosticos
          if-no-files-found: ignore
          path: |
            pizarra-sync/test-results/
            pizarra-sync/playwright-report/
            test-results/
