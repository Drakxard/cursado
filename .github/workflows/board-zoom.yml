name: Fluidez del zoom y colaboracion

on:
  push:
    paths: ["pizarra-sync/**", ".github/workflows/board-zoom.yml"]
  pull_request:
    paths: ["pizarra-sync/**", ".github/workflows/board-zoom.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: board-zoom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zoom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pizarra-sync
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pizarra-sync/pnpm-lock.yaml
      - name: Instalar dependencias de los componentes integrados de Cursado
        run: npm ci
        working-directory: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @komuboard/client-web typecheck
      - run: pnpm --filter @komuboard/client-web build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Medir zoom y comprobar geometria y colaboracion
        run: pnpm exec playwright test e2e/perf.spec.ts e2e/camera-direct.spec.ts e2e/viewport.spec.ts e2e/live-drag.spec.ts e2e/live-resize.spec.ts e2e/reconnect.spec.ts e2e/export.spec.ts --workers=1 --retries=0 --reporter=list,html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: board-zoom-diagnostics
          retention-days: 14
          if-no-files-found: ignore
          path: |
            pizarra-sync/test-results/
            pizarra-sync/playwright-report/
