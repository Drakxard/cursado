name: Conservar solo la web activa en Vercel

on:
  deployment_status:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Solo mostrar qué se eliminaría
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: vercel-cleanup-cursado
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'Drakxard/cursado' && (github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_CLEANUP_TRIGGER_SECRET: ${{ secrets.VERCEL_CLEANUP_TRIGGER_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar protección del despliegue activo
        run: node --test --experimental-strip-types tests/vercel-deployment-cleanup.test.mts tests/vercel-cleanup-route.test.mts
      - name: Limpiar despliegues obsoletos
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          if [ -z "$VERCEL_CLEANUP_TRIGGER_SECRET" ]; then
            echo 'Falta configurar la credencial del disparador de limpieza.' >&2
            exit 1
          fi
          node --input-type=module <<'JS'
          const response = await fetch('https://cursado.vercel.app/api/internal/vercel-cleanup', {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.VERCEL_CLEANUP_TRIGGER_SECRET}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ dryRun: process.env.DRY_RUN === 'true' }),
            signal: AbortSignal.timeout(240_000),
          })
          if (!response.ok) throw new Error(`La limpieza respondió HTTP ${response.status}`)
          console.log(JSON.stringify(await response.json()))
          JS
