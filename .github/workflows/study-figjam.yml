name: Pizarra de Estudio - barra y dibujo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-figjam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  study-figjam:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pizarra-sync/pnpm-lock.yaml
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: pizarraproyecto-main
      - run: pnpm install --frozen-lockfile
        working-directory: pizarra-sync
      - run: pnpm --filter @komuboard/client-web typecheck
        working-directory: pizarra-sync
      - run: npm run typecheck
      - name: Geometria del lapiz y Shift
        run: node --test --experimental-strip-types tests/study-pen-gesture.test.mts
      - name: Compilar Cursado y sus motores integrados
        run: npm run build
        env:
          STUDY_BOARD_WORKER_HOST: 127.0.0.1:8787
      - run: npx playwright install --with-deps chromium
      - name: Apertura, dibujo, PDF, navegacion y colaboracion
        run: node scripts/test-study-board.mjs --test-name-pattern="study text formatting|dragged shortcuts|study PDF background|study typing|study chrome|study compact palettes|study figjam|Shapes stay active|Study integration|diagram chooser|study pages keep|PDF names|library navigation"
        env:
          STUDY_TEST_BUILT: '1'
          STUDY_TEST_TRACE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-figjam-diagnostics
          if-no-files-found: ignore
          path: test-results/
