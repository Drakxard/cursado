name: Verificar login de Pizarra en producción
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/pizarra-login-production.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pizarra-login-produccion
          if-no-files-found: ignore
          path: test-results/
